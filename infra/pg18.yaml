api_version: pg_stand/v1
kind: PostgreSQLStand
metadata:
  name: lc-development18
spec:
  postgres:
    version: 18
    superuser: postgres
    initdb_args: --data-checksums --auth-host=scram-sha-256
    tls:
      enabled: false
    parameters:
      max_wal_size: 128MB
      min_wal_size: 32MB
      checkpoint_timeout: 60s
      max_connections: 100
      shared_buffers: 256MB
      max_logical_replication_workers: 16
      max_worker_processes: 32
      max_sync_workers_per_subscription: 3
      max_slot_wal_keep_size: 1GB
  topology:
    mode: primary_standby_logical
    replication:
      mode: sync
      username: replicator
      application_name: pg_stand_sync_physical
      max_wal_senders: 10
      max_replication_slots: 20
      wal_keep_size: 32MB
      wal_keep_segments: 64
      hot_standby_feedback: true
    logical_replication:
      publication_name: pg_stand_all_tables
      subscription_name: pg_stand_all_tables_sub
      slot_name: pg_stand_all_tables_slot
      copy_data: true
  docker:
    pull_policy: missing
    network_name: lc-development18-pg-stand-managed
    labels:
      io.pg-stand.profile: primary-standby-sync-logical
  storage:
    root_directory: .pg_stand/lc-development18
  nodes:
    primary:
      container_name: lc-development18-primary-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55481
      ssh_published_port: 55581
      pgbouncer_session_published_port: 55681
      pgbouncer_transaction_published_port: 55781
      shm_size: 512m
      cpu_limit: 2.0
      memory_limit: 1g
    standby:
      container_name: lc-development18-standby-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55482
      ssh_published_port: 55582
      pgbouncer_session_published_port: 55682
      pgbouncer_transaction_published_port: 55782
      shm_size: 512m
      cpu_limit: 2.0
      memory_limit: 1g
    logical:
      container_name: lc-development18-logical-pg-stand-managed
      bind_address: 127.0.0.1
      published_port: 55483
      ssh_published_port: 55583
      pgbouncer_session_published_port: 55683
      pgbouncer_transaction_published_port: 55783
      shm_size: 512m
      cpu_limit: 2.0
      memory_limit: 1g
