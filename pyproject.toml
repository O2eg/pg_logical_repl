[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-logical-repl"
version = "0.2.0"
description = "Plan-driven PostgreSQL native logical replication and schema orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["asyncpg>=0.30,<1", "PyYAML>=6,<7", "pglast>=7,<9", "rfc8785>=0.1.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6", "ruff>=0.9", "build>=1"]

[project.scripts]
pg-logical-repl = "pg_logical_repl.cli:main"

[project.urls]
Repository = "https://github.com/O2eg/pg_logical_repl"
Issues = "https://github.com/O2eg/pg_logical_repl/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pg_logical_repl*"]
namespaces = false

[tool.setuptools.package-data]
pg_logical_repl = ["sql/*.sql"]

[tool.setuptools.data-files]
"share/doc/pg-logical-repl" = ["README.md", "IMPLEMENTATION_STATUS.md"]
"share/doc/pg-logical-repl/docs" = [
  "docs/DDL_IMPLEMENTATION.md",
  "docs/TESTING.md",
  "docs/RELEASING.md",
]
"share/doc/pg-logical-repl/examples" = ["examples/local.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not soak and not replay'"
pythonpath = ["tests"]
markers = [
    "integration: requires owned PostgreSQL test stands",
    "quality: independent oracle, process/network faults and generated scenarios",
    "soak: opt-in sustained CLI workload",
    "replay: explicit saved generated sequence",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
