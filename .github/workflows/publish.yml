name: Test and publish to PyPI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check code style
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests without PostgreSQL endpoints
        run: python -m pytest -q --ignore=tests/integration

  build:
    name: Build and verify distributions
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - name: Verify package and tag versions
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(pathlib.Path("src/pg_logical_repl/__init__.py").read_text())
          runtime = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          if runtime != version:
              raise SystemExit(f"Runtime version {runtime} differs from package version {version}")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Validate metadata and packaged documentation
        run: |
          python -m twine check dist/*
          python tests/check_distribution.py dist/*.whl dist/*.tar.gz
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/pg-logical-repl-wheel"
          "${RUNNER_TEMP}/pg-logical-repl-wheel/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/pg-logical-repl-wheel/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/pg-logical-repl-wheel/bin/pg-logical-repl" --version
          "${RUNNER_TEMP}/pg-logical-repl-wheel/bin/pg-logical-repl" --machine --capabilities
          "${RUNNER_TEMP}/pg-logical-repl-wheel/bin/pg-logical-repl" --machine --component-capabilities
          "${RUNNER_TEMP}/pg-logical-repl-wheel/bin/python" - <<'PY'
          import pathlib
          import sysconfig
          from importlib.resources import files

          docs = pathlib.Path(sysconfig.get_path("data")) / "share/doc/pg-logical-repl"
          for name in (
              "README.md", "docs/DDL_IMPLEMENTATION.md",
              "docs/TESTING.md", "docs/RELEASING.md", "examples/local.yaml",
          ):
              if not (docs / name).is_file():
                  raise SystemExit(f"Missing installed documentation: {name}")
          if not files("pg_logical_repl").joinpath("sql/capture.sql").is_file():
              raise SystemExit("Missing installed SQL resources")
          print(f"Installed documentation: {docs}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with OIDC
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'O2eg/pg_logical_repl'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/pg-logical-repl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
